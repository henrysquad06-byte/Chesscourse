<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Henry's Chess</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222222;
      min-height: 100vh;
    }

    /* TOP BAR */

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 25px;
      border-bottom: 1px solid #dddddd;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
      white-space: nowrap;
    }

    .progress-container {
      flex: 1;
      max-width: 700px;
      height: 14px;
      background: #dddddd;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 18%;
      height: 100%;
      background: #58cc02;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .streak {
      font-weight: bold;
      color: #ff9800;
      white-space: nowrap;
    }

    .logout {
      border: none;
      background: #eeeeee;
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
      font-weight: bold;
    }

    /* MAIN */

    .lesson {
      width: min(1150px, 94%);
      margin: 35px auto 60px;
    }

    .lesson-title {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .lesson-subtitle {
      color: #777777;
      margin-top: 0;
      margin-bottom: 25px;
    }

    /* OSCAR */

    .teacher {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .oscar {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid #eeeeee;
    }

    .oscar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .speech {
      background: #ffffff;
      border: 2px solid #dddddd;
      border-radius: 18px;
      padding: 18px 22px;
      font-size: 20px;
      max-width: 650px;
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .speech::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 30px;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-left: 2px solid #dddddd;
      border-bottom: 2px solid #dddddd;
      transform: rotate(45deg);
    }

    /* GAME AREA */

    .game-area {
      display: flex;
      gap: 35px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* CHESS BOARD */

    .board {
      width: min(620px, 90vw);
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(30px, 7vw, 68px);
      user-select: none;
      cursor: pointer;
      position: relative;
    }

    .light {
      background: #f0f0dc;
    }

    .dark {
      background: #79a85b;
    }

    .square:hover {
      filter: brightness(1.08);
    }

    .piece {
      line-height: 1;
      filter: drop-shadow(0 3px 1px rgba(0, 0, 0, 0.25));
    }

    /* SIDE PANEL */

    .side-panel {
      width: 290px;
      background: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .side-panel h2 {
      margin-top: 0;
    }

    .stat {
      background: #f3f3f3;
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
    }

    .lesson-status {
      margin: 18px 0;
      padding: 14px;
      border-radius: 12px;
      background: #eef9e8;
      color: #347d10;
      font-weight: bold;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #58cc02;
      color: white;
      box-shadow: 0 4px 0 #3c9400;
      margin-top: 8px;
    }

    .button:hover {
      background: #62dc06;
    }

    .button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #3c9400;
    }

    .secondary-button {
      width: 100%;
      border: 2px solid #dddddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #444444;
      margin-top: 12px;
    }

    /* FOOTER */

    .bottom-message {
      margin-top: 30px;
      text-align: center;
      color: #777777;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .topbar {
        padding: 0 12px;
        gap: 10px;
      }

      .logo {
        display: none;
      }

      .lesson-title {
        font-size: 30px;
      }

      .teacher {
        align-items: flex-start;
      }

      .oscar {
        width: 85px;
        height: 85px;
      }

      .speech {
        font-size: 17px;
      }

      .side-panel {
        width: min(620px, 90vw);
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN CHECK -->

  <script>
    if (sessionStorage.getItem("chessLoggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>


  <!-- TOP BAR -->

  <header class="topbar">

    <div class="logo">
      ♟️ Henry's Chess
    </div>

    <div class="progress-container">
      <div
        class="progress"
        id="progressBar">
      </div>
    </div>

    <div class="streak">
      🔥 <span id="streak">0</span>
    </div>

    <button
      class="logout"
      onclick="logout()">
      Log out
    </button>

  </header>


  <!-- MAIN LESSON -->

  <main class="lesson">

    <h1 class="lesson-title">
      Learn Chess
    </h1>

    <p class="lesson-subtitle">
      Lesson 1 • Your first chess moves
    </p>


    <!-- OSCAR -->

    <section class="teacher">

      <div class="oscar">

        <img
          src="assets/oscar/idle.png"
          alt="Oscar">

      </div>

      <div
        class="speech"
        id="oscarSpeech">

        Welcome to chess! Let's warm up with this one.

      </div>

    </section>


    <!-- GAME -->

    <section class="game-area">

      <div>

        <div
          class="board"
          id="board"
          aria-label="Chess board">
        </div>

      </div>


      <!-- LESSON PANEL -->

      <aside class="side-panel">

        <h2>Lesson 1</h2>

        <p>
          Learn how the pieces move.
        </p>

        <div class="stat">
          ⭐ Progress:
          <span id="progressText">0%</span>
        </div>

        <div class="stat">
          ♟️ Moves:
          <span id="moveCount">0</span>
        </div>

        <div
          class="lesson-status"
          id="status">

          Ready to learn!

        </div>

        <button
          class="button"
          onclick="nextLesson()">

          Continue

        </button>

        <button
          class="secondary-button"
          onclick="resetBoard()">

          Reset board

        </button>

      </aside>

    </section>


    <div class="bottom-message">

      🧠 Learn by doing • ♟️ Practice • 🏆 Improve

    </div>

  </main>


  <script>

    /* CHESS STARTING POSITION */

    const startingPosition = [

      "rnbqkbnr",
      "pppppppp",
      "........",
      "........",
      "........",
      "........",
      "PPPPPPPP",
      "RNBQKBNR"

    ];


    /* CHESS PIECES */

    const pieces = {

      "K": "♔",
      "Q": "♕",
      "R": "♖",
      "B": "♗",
      "N": "♘",
      "P": "♙",

      "k": "♚",
      "q": "♛",
      "r": "♜",
      "b": "♝",
      "n": "♞",
      "p": "♟"

    };


    const board =
      document.getElementById("board");

    let moveCount = 0;


    /* CREATE BOARD */

    function createBoard() {

      board.innerHTML = "";

      for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

          const square =
            document.createElement("div");

          square.classList.add("square");


          if ((row + col) % 2 === 0) {

            square.classList.add("light");

          } else {

            square.classList.add("dark");

          }


          const piece =
            startingPosition[row][col];


          if (piece !== ".") {

            const pieceElement =
              document.createElement("span");

            pieceElement.className =
              "piece";

            pieceElement.textContent =
              pieces[piece];

            square.appendChild(
              pieceElement
            );

          }


          board.appendChild(square);

        }

      }

    }


    /* CONTINUE BUTTON */

    function nextLesson() {

      document.getElementById("oscarSpeech").textContent =
        "Nice! The next lesson is coming soon. ♟️";

      document.getElementById("status").textContent =
        "Lesson complete! 🎉";

      document.getElementById("progressBar").style.width =
        "25%";

      document.getElementById("progressText").textContent =
        "25%";

    }


    /* RESET */

    function resetBoard() {

      moveCount = 0;

      document.getElementById("moveCount").textContent =
        "0";

      document.getElementById("oscarSpeech").textContent =
        "Let's try again! ♟️";

      document.getElementById("status").textContent =
        "Ready to learn!";

      createBoard();

    }


    /* LOG OUT */

    function logout() {

      sessionStorage.removeItem("chessLoggedIn");

      window.location.href =
        "login.html";

    }


    /* START */

    createBoard();

  </script>

</body>
</html>
